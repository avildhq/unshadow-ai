name: Build & Release

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [prod]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unshadow-ai-${{ runner.os }}
          path: dist/unshadow-ai*

  release:
    needs: build
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/unshadow-ai-Windows/unshadow-ai.exe release/unshadow-ai-windows.exe || true
          cp artifacts/unshadow-ai-macOS/unshadow-ai release/unshadow-ai-macos || true
          cp artifacts/unshadow-ai-Linux/unshadow-ai release/unshadow-ai-linux || true
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Unshadow-AI Build ${{ github.run_number }}
          generate_release_notes: true
          files: release/*
